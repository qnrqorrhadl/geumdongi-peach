name: APK 만들기

# 수동 실행(Actions 탭 → APK 만들기 → Run workflow) 또는 android 폴더가 바뀔 때 자동 실행
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK 준비
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: APK 빌드
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk geumdongi-peach.apk

      - name: 파일 보관 (Actions 화면에서 받을 수 있음)
        uses: actions/upload-artifact@v4
        with:
          name: geumdongi-peach-apk
          path: geumdongi-peach.apk

      - name: 누구나 받을 수 있는 다운로드 링크 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest geumdongi-peach.apk \
            --title "금동이네 꿀복통 APK (최신)" \
            --notes "안드로이드 설치 파일입니다. 화면은 웹에서 불러오므로 웹 파일을 고치면 앱에도 바로 반영됩니다."
